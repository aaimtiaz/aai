<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Writings | Ahmad Al-Imtiaz</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P6X673H4S7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P6X673H4S7');
  </script>
</head>
<body>
  <header>
    <h1>Writings</h1>
    <p>Ahmad Al-Imtiaz | Prospective Graduate Student</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="assets/pdfs/Curriculum Vitae_Ahmad Al-Imtiaz.pdf" target="_blank" rel="noopener noreferrer">Curriculum Vitae</a>
      <a href="research.html">Research</a>
      <a href="teaching.html">Teaching</a>
      <a href="outreach.html">Outreach</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="writing-hero"></section>

    <section id="writing-grid" class="writing-grid"></section>

    <section id="contact">
      <h2>Contact Information</h2>
      <p>Email: <a href="mailto:ahmadal.imtiaz@gmail.com">ahmadal.imtiaz@gmail.com</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; Ahmad Al-Imtiaz | Last updated: <span id="last-updated"></span></p>

    <script>
      // Grab the last modified date of the file
      const modifiedDate = new Date(document.lastModified);

      // Format it beautifully (e.g., "February 21, 2026")
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      const formattedDate = modifiedDate.toLocaleDateString('en-US', options);

      // Inject it into the span above
      document.getElementById('last-updated').textContent = formattedDate;
    </script>
  </footer>

  <div id="modal" style="display:none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: #EEEEEE; width: 70vw; min-width: 300px; height: 90vh; overflow-y: auto; padding: 30px; border-radius: 8px; position: relative;">
      <button id="modal-close" style="position: absolute; top: 10px; right: 10px; font-size: 1.5rem; background: none; border: none; cursor: pointer;">&times;</button>
      <div id="modal-content" class="writing-body"></div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    const modalClose = document.getElementById('modal-close');
    const heroSection = document.getElementById('writing-hero');
    const gridSection = document.getElementById('writing-grid');

    function el(tag, opts = {}) {
      const node = document.createElement(tag);
      if (opts.className) node.className = opts.className;
      if (opts.text !== undefined) node.textContent = opts.text;
      if (opts.href !== undefined) node.href = opts.href;
      if (opts.src !== undefined) node.src = opts.src;
      if (opts.alt !== undefined) node.alt = opts.alt;
      return node;
    }

    function openModal(writing) {
      modalContent.innerHTML = '';
      modalContent.appendChild(el('img', { src: writing.image, alt: writing.title }));
      if (writing.imageCaption) {
        modalContent.appendChild(el('p', { className: 'caption', text: writing.imageCaption }));
      }
      modalContent.appendChild(el('h2', { text: writing.title }));
      if (writing.intro) {
        modalContent.appendChild(el('p', { className: 'intro', text: writing.intro }));
      }
      const bodyClass = writing.bodyStyle === 'prose' ? 'prose' : 'poem';
      modalContent.appendChild(el('p', { className: bodyClass, text: writing.body }));
      if (writing.note) {
        modalContent.appendChild(el('p', { className: 'note', text: writing.note }));
      }
      if (writing.date) {
        modalContent.appendChild(el('p', { className: 'date', text: '— ' + writing.date }));
      }
      modal.style.display = 'flex';
    }

    modalClose.addEventListener('click', () => {
      modal.style.display = 'none';
      modalContent.innerHTML = '';
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
      }
    });

    function renderHero(writing) {
      const section = el('section', { className: 'writing-hero' });
      section.appendChild(el('img', { src: writing.image, alt: writing.title }));

      const textWrap = document.createElement('div');
      const heading = document.createElement('h2');
      const link = el('a', { href: '#', text: writing.title });
      link.addEventListener('click', (e) => { e.preventDefault(); openModal(writing); });
      heading.appendChild(link);
      textWrap.appendChild(heading);

      const excerptText = writing.excerpt || writing.body.split('\n')[0];
      textWrap.appendChild(el('p', { className: 'excerpt', text: excerptText }));

      section.appendChild(textWrap);
      heroSection.appendChild(section);
    }

    function renderCard(writing) {
      const article = el('article', { className: 'writing-card' });
      const link = el('a', { href: '#' });
      link.appendChild(el('img', { src: writing.image, alt: writing.title }));
      link.appendChild(el('h3', { text: writing.title }));
      link.addEventListener('click', (e) => { e.preventDefault(); openModal(writing); });
      article.appendChild(link);
      gridSection.appendChild(article);
    }

    fetch('assets/data/writings.json')
      .then(res => res.json())
      .then(writings => {
        if (!writings.length) return;
        renderHero(writings[0]);
        writings.slice(1).forEach(renderCard);
      })
      .catch(err => {
        gridSection.textContent = 'Unable to load writings right now.';
        console.error(err);
      });
  </script>

</body>
</html>
